<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8b1a2b" />
    <meta
      name="description"
      content="Sistema Oficial de Gestión y Tratamiento Digital de Documentos PDF - Corte Superior de Justicia de Lambayeque (Poder Judicial del Perú)."
    />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="manifest.json" />

    <!-- Google Fonts oficiales CSJLA: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- es-ES ships on every boot as primary institutional language for PJ-DOCS -->
    <link
      rel="preload"
      href="locales/es-ES/translation.toml"
      as="fetch"
      crossorigin
    />
    <script>
      (function () {
        try {
          var source = localStorage.getItem("i18nextLng-source");
          var lng = localStorage.getItem("i18nextLng");
          // Si el usuario no ha forzado un idioma manual específico, asegurar siempre es-ES
          if (source !== "3" || !lng || lng === "en-US" || lng === "en" || lng === "es-PE") {
            localStorage.setItem("i18nextLng", "es-ES");
            localStorage.setItem("i18nextLng-source", "2");
          }
          // Portal libre sin login: purgar tokens y sesiones residuales previas
          localStorage.removeItem("stirling_jwt");
          localStorage.removeItem("stirling_refresh_token");
          localStorage.removeItem("stirling_user_info");
          sessionStorage.removeItem("stirling_jwt");
        } catch (e) {}
      })();
    </script>

    <title>PJ-DOCS</title>

    <!-- Apply theme before first paint (no FOUC); mirrors ThemeProvider, which then refines it. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(
            localStorage.getItem("stirlingpdf_preferences") || "{}",
          );
          var mode = p.theme || "system";
          var scheme =
            mode === "light"
              ? "light"
              : mode === "dark"
                ? "dark"
                : window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          var r = document.documentElement;
          r.setAttribute("data-theme", scheme);
          r.setAttribute("data-app-theme", "custom");
          r.setAttribute("data-accent", "default");
          r.setAttribute("data-mantine-color-scheme", scheme);
        } catch (e) {
          /* first visit / unavailable storage: ThemeProvider handles it */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Debes habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
